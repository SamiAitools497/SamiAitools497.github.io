<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sami AI Tools — Premium AI Subscriptions</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#050510;--card:rgba(255,255,255,.045);--border:rgba(255,255,255,.09);--text:#f5f5ff;--muted:#9292aa;--primary:#667eea;--secondary:#764ba2;--pink:#f093fb;--green:#25d366;--gold:#ffb300;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:sans-serif;padding:20px;}
header{display:flex;justify-content:space-between;align-items:center;padding:15px 5%;background:rgba(5,5,16,.9);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.logo{font-size:18px;font-weight:900;background:linear-gradient(135deg,#667eea,#f093fb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hero{text-align:center;padding:40px 20px;}
.hero h1{font-size:28px;margin-bottom:10px;}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px;max-width:1100px;margin:20px auto;}
.product{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:15px;display:flex;flex-direction:column;}
.product-icon{font-size:45px;text-align:center;margin-bottom:10px;}
.product-title{font-size:14px;font-weight:bold;margin-bottom:8px;}
.product-desc{color:var(--muted);font-size:11px;margin-bottom:12px;flex:1;}
.new-price{font-size:18px;font-weight:bold;color:var(--primary);margin-bottom:10px;}
.buy-btn{background:var(--green);color:white;border:0;padding:10px;border-radius:8px;font-weight:bold;cursor:pointer;text-align:center;text-decoration:none;display:block;}
</style>
</head>
<body>

<header>
    <div class="logo">◆ Sami AI Tools</div>
    <div>🛒 Cart</div>
</header>

<div class="hero">
    <h1>Unlock The Power Of AI</h1>
    <p>Premium AI tools & subscriptions at affordable prices.</p>
</div>

<div class="products" id="productsContainer">
    <div style="text-align:center;grid-column:1/-1;color:#9292aa;">Loading products...</div>
</div>

<script>
const SUPABASE_URL = "https://ovktqkltatyfbzmwlwla.supabase.co";
const SUPABASE_KEY = "sb_publishable_xYKjjm0YywNfblgeZuCNtA_X7fOhrwi";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const fallbackProducts = [
    { id: 1, name: 'ChatGPT Plus K12 Edu — 2 Years', urdu: 'چیٹ جی پی ٹی پلس کے 12 ایجو — 2 سال', desc: '50 Accounts Added with Full Warranty', price: 1650, icon: '🤖' },
    { id: 2, name: 'Duolingo Super — 12 Months', urdu: 'ڈولنگو سپر — 12 ماہ', desc: '101 Accounts Added - Premium Language Learning', price: 300, icon: '🦉' },
    { id: 3, name: 'CapCut Pro — 6 Days FW', urdu: 'کیپ کٹ پرو — 6 دن فل وارنٹی', desc: 'Full Warranty Key - 39 Keys in Stock', price: 150, icon: '🎬' },
    { id: 4, name: 'Gemini Pro — 18 Months (Link)', urdu: 'جیمنائی پرو — 18 ماہ (لنک)', desc: '117 in stock with link access', price: 240, icon: '✨' },
    { id: 5, name: 'CapCut Pro — 6 Months', urdu: 'کیپ کٹ پرو — 6 ماہ', desc: '18 in stock', price: 2670, icon: '🎞️' },
    { id: 6, name: 'CapCut Pro — 1 Month FW', urdu: 'کیپ کٹ پرو — 1 ماہ فل وارنٹی', desc: '219 in stock with Full Warranty', price: 390, icon: '🎥' }
];

async function loadProducts() {
    const container = document.getElementById("productsContainer");
    let items = fallbackProducts;

    try {
        const { data, error } = await supabaseClient.from('products').select('*');
        if (!error && data && data.length > 0) {
            items = data;
        }
    } catch (e) {
        console.log("Using fallback data");
    }

    container.innerHTML = items.map(p => `
        <div class="product">
            <div class="product-icon">${p.icon || '📦'}</div>
            <div class="product-title">${p.name}</div>
            <div class="product-desc">${p.desc || p.description || ''}</div>
            <div class="new-price">Rs. ${Number(p.price).toLocaleString()}</div>
            <a href="https://wa.me/966595073180?text=Salam,%20mujhe%20ye%20product%20chahiye:%20${encodeURIComponent(p.name)}" class="buy-btn" target="_blank">⚡ Order on WhatsApp</a>
        </div>
    `).join("");
}

loadProducts();
</script>

</body>
</html>
